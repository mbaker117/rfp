spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rfp}
    username: ${DB_USER:rfp}
    password: ${DB_PASS:rfp}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080

rfp:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-at-least-32-chars}
    expiry-hours: 24
  llm:
    provider: ${RFP_LLM_PROVIDER:anthropic}   # anthropic | openai
    api-key: ${RFP_LLM_API_KEY:${ANTHROPIC_API_KEY:}}
    model: ${RFP_LLM_MODEL:claude-sonnet-4-6}
    base-url: ${RFP_LLM_BASE_URL:}            # leave blank to use provider default
    max-tokens: 8192
  scraper:
    throttle-ms: 2000
    refresh-days: 7
    adaptive-enabled: true    # set false to fall back to the legacy inline Playwright scrape
